services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: streaming
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    depends_on:
      - db
      - livekit
      - redis

  nginx:
    image: nginx:alpine
    container_name: streaming_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  frontend:
    image: node:22-alpine
    container_name: vue_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

  db:
    image: postgres:16-alpine
    container_name: stream
    environment:
      POSTGRES_DB: stream
      POSTGRES_USER: stream
      POSTGRES_PASSWORD: stream
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: streaming_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@stream.com
      PGADMIN_DEFAULT_PASSWORD: stream
    ports:
      - "5050:80"
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: streaming_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: streaming_livekit
    command:
      - --config
      - /etc/livekit/livekit.yaml
    volumes:
      - ./docker/livekit/livekit.yaml:/etc/livekit/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis
    restart: unless-stopped

  egress:
    image: livekit/egress:latest
    container_name: streaming_egress
    depends_on:
      - livekit
      - redis
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: mydevkey
        api_secret: my-super-secret-livekit-key-1234567890
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
    volumes:
      - ./backend/storage/app/public/videos/recordings:/recordings
    cap_add:
      - SYS_ADMIN
    restart: unless-stopped
  reverb:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: streaming_reverb
    user: "1000:1000"
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - app
      
volumes:
  pgdata: